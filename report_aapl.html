
<!doctype html>
<html><head>
  <meta charset='utf-8'/>
  <title>Performance Report</title>
  <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { display: flex; gap: 24px; }
    .col { flex: 1; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>
  <h2>Performance Report</h2>
  <div class='row'>
    <div class='col'>
      <h3>Equity Curve</h3>
      <canvas id='eq'></canvas>
    </div>
    <div class='col'>
      <h3>Metrics</h3>
      <table><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>
        <tr><td>initial</td><td>1000000.000000</td></tr><tr><td>final</td><td>1000000.000000</td></tr><tr><td>sharpe</td><td>0.000000</td></tr><tr><td>sortino</td><td>0.000000</td></tr><tr><td>cagr</td><td>0.000000</td></tr><tr><td>max_drawdown</td><td>0.000000</td></tr>
      </tbody></table>
    </div>
  </div>
  <script>
    const labels = ['2023-01-03T00:00:00+00:00', '2023-01-04T00:00:00+00:00'];
    const data = [1000000.0, 1000000.0];
    const ctx = document.getElementById('eq').getContext('2d');
    new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'Net Liq', data, borderColor: '#1976d2', fill: false }] }, options: { responsive: true, scales: { x: { display: false } } } });
  </script>
</body></html>
